on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

name: CI Tests
permissions:
  contents: "read"
# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
# This will ensure that only one commit will be running tests at a time on each PR.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check_and_test:
    name: Check
    strategy:
      fail-fast: false
      matrix:
        target: [mysql, mariadb]
        compiler_target:
          [
            { os: ubuntu-latest, target: x86_64-unknown-linux-gnu },
            { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu },
            { os: macos-15-intel, target: x86_64-apple-darwin },
            { os: macos-26, target: aarch64-apple-darwin },
            { os: windows-2025, target: x86_64-pc-windows-msvc },
          ]
        features: [default, buildtime_bindgen, bundled]
        openssl: ["-F openssl-sys/vendored", ""]
        include:
          - target: mysql
            compiler_target:
              { os: windows-2025, target: x86_64-pc-windows-msvc }
            install: vcpkg
            features: buildtime_bindgen
          - target: mariadb
            compiler_target:
              { os: windows-2025, target: x86_64-pc-windows-msvc }
            install: vcpkg
            features: buildtime_bindgen
          - target: mysql
            compiler_target:
              { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
            features: bundled
            openssl: "-F openssl-sys/vendored"
          - target: mysql
            compiler_target:
              { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
            features: bundled
            openssl: "-F openssl-sys/vendored"
        exclude:
          # Bundled builds never use MariaDB target
          - target: mariadb
            features: bundled
          # The openssl feature is only relevant for bundled builds
          - features: default
            openssl: "-F openssl-sys/vendored"
          - features: buildtime_bindgen
            openssl: "-F openssl-sys/vendored"
          # Building without system openssl isn't useful on Windows hosts
          - compiler_target:
              { os: windows-2025, target: x86_64-pc-windows-msvc }
            openssl: ""

    runs-on: ${{ matrix.compiler_target.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2.8.2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Set environment variables
        shell: bash
        run: |
          echo "RUSTFLAGS=-D warnings" >> $GITHUB_ENV
          echo "RUSTDOCFLAGS=-D warnings" >> $GITHUB_ENV

      - name: Stop current MySQL server
        if: ${{ runner.os == 'Linux' && matrix.target == 'mariadb' }}
        shell: bash
        run: |
          sudo systemctl stop mysql.service
          sudo apt-get purge -y mysql-server

      - name: Install MySQL (Linux)
        if: ${{ runner.os == 'Linux' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          sudo systemctl start mysql.service
          sudo apt-get update
          sudo apt-get -y install libmysqlclient-dev

      - name: Install MariaDB Client Libs and Server (Linux)
        if: ${{ runner.os == 'Linux' && matrix.target == 'mariadb' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get -y install libmariadb-dev mariadb-server
          sleep 3
          sudo mysql -e 'set password=password("root")'

      - name: Linux env
        if: ${{ runner.os == 'Linux' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          sudo systemctl start mysql.service
          mysql -e "create database diesel_test; create database diesel_unit_test; grant all on \`diesel_%\`.* to 'root'@'localhost';" -uroot -proot
          echo "MYSQL_DATABASE_URL=mysql://root:root@localhost/diesel_test" >> $GITHUB_ENV
          echo "MYSQL_EXAMPLE_DATABASE_URL=mysql://root:root@localhost/diesel_example" >> $GITHUB_ENV
          echo "MYSQL_UNIT_TEST_DATABASE_URL=mysql://root:root@localhost/diesel_unit_test" >> $GITHUB_ENV

      - name: Install MySQL (MacOS Intel)
        if: ${{ matrix.compiler_target.os == 'macos-15-intel' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        run: |
          brew update
          brew install mysql@8.0
          brew services start mysql@8.0
          sleep 3
          /usr/local/opt/mysql@8.0/bin/mysql -e "create database diesel_test; create database diesel_unit_test;"
          /usr/local/opt/mysql@8.0/bin/mysql -e "create user runner@localhost; grant all on \`diesel_%\`.* to 'runner'@'localhost';"
          echo "PKG_CONFIG_PATH=/usr/local/opt/mysql@8.0/lib/pkgconfig" >> $GITHUB_ENV
          ls /usr/local/opt/mysql@8.0/include/mysql

      - name: Install MariaDB 10.5 (MacOS Intel)
        if: ${{ matrix.compiler_target.os == 'macos-15-intel' && matrix.target == 'mariadb' }}
        run: |
          brew install mariadb@10.6
          echo "PKG_CONFIG_PATH=/usr/local/opt/mariadb@10.6/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install MySQL (MacOS M1)
        if: ${{ matrix.compiler_target.os == 'macos-26' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        run: |
          brew update
          brew install mysql@8.4
          brew services start mysql@8.4
          sleep 3
          /opt/homebrew/opt/mysql@8.4/bin/mysql -e "create database diesel_test; create database diesel_unit_test;"
          /opt/homebrew/opt/mysql@8.4/bin/mysql -e "create user runner@localhost; grant all on \`diesel_%\`.* to 'runner'@'localhost';"
          echo "MYSQLCLIENT_LIB_DIR=/opt/homebrew/opt/mysql@8.4/lib" >> $GITHUB_ENV
          echo "MYSQLCLIENT_INCLUDE_DIR=/opt/homebrew/opt/mysql@8.4/include/mysql" >> $GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=8.4" >> $GITHUB_ENV

      - name: Install MariaDB latest (MacOS M1)
        if: ${{ matrix.compiler_target.os == 'macos-26' && matrix.target == 'mariadb' }}
        run: |
          brew update
          brew install mariadb@11.4
          ls /opt/homebrew/opt/mariadb@11.4/lib/pkgconfig
          sleep 3
          echo "MYSQLCLIENT_LIB_DIR=/opt/homebrew/opt/mariadb@11.4/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/mariadb@11.4/lib/pkgconfig" >> $GITHUB_ENV

      - name: Env MacOS
        if: (runner.os == 'macos-15-intel' || runner.os == 'macos-15') && !startsWith(matrix.features, 'bundled')
        run: |
          echo "MYSQL_DATABASE_URL=mysql://runner@localhost/diesel_test" >> $GITHUB_ENV
          echo "MYSQL_EXAMPLE_DATABASE_URL=mysql://runner@localhost/diesel_example" >> $GITHUB_ENV
          echo "MYSQL_UNIT_TEST_DATABASE_URL=mysql://runner@localhost/diesel_unit_test" >> $GITHUB_ENV

      - name: Install MySQL (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          curl -L https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.0-winx64.zip -o library.zip
          unzip library.zip

      - name: Install MariaDB (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mariadb' }}
        shell: bash
        run: |
          curl -L https://archive.mariadb.org/mariadb-11.5.2/winx64-packages/mariadb-11.5.2-winx64.zip -o library.zip
          unzip library.zip

      - name: Set variables for mysql (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mysql' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          echo "MYSQLCLIENT_LIB_DIR=$WORKSPACE/mysql-8.4.0-winx64/lib/" >> $GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=8.4.0" >> $GITHUB_ENV
          echo "MYSQLCLIENT_INCLUDE_DIR=$WORKSPACE/mysql-8.4.0-winx64/include" >> $GITHUB_ENV
          dir ./mysql-8.4.0-winx64/lib
          dir ./mysql-8.4.0-winx64/include

      - name: Set variables for MariaDB (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target == 'mariadb' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          echo "MYSQLCLIENT_LIB_DIR=$WORKSPACE/mariadb-11.5.2-winx64/lib/" >> $GITHUB_ENV
          echo "MYSQLCLIENT_INCLUDE_DIR=$WORKSPACE/mariadb-11.5.2-winx64/include/mysql/" >> $GITHUB_ENV
          echo "MYSQLCLIENT_VERSION=11.5.2" >> $GITHUB_ENV
          echo "MYSQLCLIENT_LIBNAME=mariadbclient" >> $GITHUB_ENV
          dir ./mariadb-11.5.2-winx64/lib
          dir ./mariadb-11.5.2-winx64/include

      - name: Windows setup (bundled)
        if: ${{ runner.os == 'Windows' && startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          echo "OPENSSL_RUST_USE_NASM=0" >> $GITHUB_ENV
          echo OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl >> $GITHUB_ENV

      - name: Install rust toolchain
        env:
          TARGET: ${{ matrix.compiler_target.target }}
        run: |
          rustup update stable
          rustup target add $TARGET
          rustup override set stable
          rustup component add rustfmt
          cargo --version
          rustc --version

      - name: Setup musl toolchain (aarch64)
        if: ${{ matrix.compiler_target.target == 'aarch64-unknown-linux-musl' ||  matrix.compiler_target.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "TARGET_CXX=g++" >> $GITHUB_ENV

      - name: Check
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          OPENSSL: ${{ matrix.openssl }}
          TARGET: ${{ matrix.compiler_target.target }}
        run: |
          cargo check --no-default-features --features "$FEATURES" $OPENSSL --verbose --target $TARGET

      - name: Tests
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          OPENSSL: ${{ matrix.openssl }}
          TARGET: ${{ matrix.compiler_target.target }}
        run: |
          cargo test --no-default-features --features "$FEATURES" $OPENSSL --target $TARGET

      - name: Test compile diesel
        shell: bash
        # allow to fail as diesel might not pull in the right feature yet
        continue-on-error: true
        env:
          FEATURES: ${{ matrix.features }}
          OPENSSL: ${{ matrix.openssl }}
          TARGET: ${{ matrix.compiler_target.target }}
        run: |
          cargo new test_diesel
          cd test_diesel
          echo "[workspace]" >> Cargo.toml
          cargo add diesel --no-default-features --features "mysql" --git "https://github.com/diesel-rs/diesel/" --branch "main"
          cargo add mysqlclient-sys openssl-sys@0.9.93
          echo "[patch.crates-io]" >> Cargo.toml
          echo "mysqlclient-sys = { path = \"..\" }" >> Cargo.toml
          cat Cargo.toml
          echo "use diesel::prelude::*;" > src/main.rs
          echo "fn main() { MysqlConnection::establish(\"foo\").unwrap(); }" >> src/main.rs
          cargo build --features "mysqlclient-sys/$FEATURES" $OPENSSL --target $TARGET

      - name: Generated bindings.rs
        if: ${{ runner.os != 'Windows' && !startsWith(matrix.features, 'bundled') }}
        shell: bash
        run: |
          find . -name bindings.rs -ls -exec cat {} \;

      - name: Test all files included
        shell: bash
        if: ${{ matrix.features == 'bundled' }}
        env:
          OPENSSL: ${{ matrix.openssl }}
          TARGET: ${{ matrix.compiler_target.target }}
        run: |
          rm -rf test_diesel
          git reset --hard HEAD
          cd mysqlclient-src
          cargo package $OPENSSL --target $TARGET
